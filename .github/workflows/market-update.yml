name: 宋择机真实行情更新（普通代码）
on:
  schedule:
    # UTC; Asia/Shanghai is UTC+8. Quotes after close, daily history after 21:00.
    - cron: '17 7 * * 1-5'
    - cron: '17 13 * * 1-5'
  workflow_dispatch:
    inputs:
      daily:
        description: '同时更新完整日线和候选（21点后使用）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: songzeji-market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: https://ashare-opportunity-lab.kindkite3.chatgpt.site
      SITE_SERVICE_TOKEN: ${{ secrets.SITE_SERVICE_TOKEN }}
      SITE_SYNC_KEY: ${{ secrets.SITE_SYNC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install baostock==0.9.4 pandas==2.3.3
      - name: Download actual data, update Site, verify readback
        run: |
          if [ '${{ github.event.schedule }}' = '17 13 * * 1-5' ] || [ '${{ inputs.daily }}' = 'true' ]; then
            python -u market-data/cloud_update.py --daily
          else
            python -u market-data/cloud_update.py
          fi
